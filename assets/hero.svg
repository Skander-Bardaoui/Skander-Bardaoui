<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle heroDesc">
<title id="heroTitle">Skander Bardaoui — Full-Stack Developer</title>
<desc id="heroDesc">Cinematic dark teal hero with a holographic ID badge, full-stack developer title, open to PFE 2026 status, and profile statistics.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
    <stop stop-color="#02090A"/><stop offset=".55" stop-color="#04171A"/><stop offset="1" stop-color="#020B0D"/>
  </linearGradient>
  <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(280 70) rotate(36) scale(540 540)">
    <stop stop-color="#22D3EE" stop-opacity=".20"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowTeal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1160 520) rotate(-140) scale(540 540)">
    <stop stop-color="#14B8A6" stop-opacity=".16"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vignette" cx=".5" cy=".5" r=".78">
    <stop offset=".55" stop-color="#02090A" stop-opacity="0"/><stop offset="1" stop-color="#02090A" stop-opacity=".68"/>
  </radialGradient>
  <linearGradient id="nameGrad" x1="64" y1="250" x2="560" y2="320" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F8FAFC"/><stop offset=".55" stop-color="#A5F3FC"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="lineGrad" x1="64" y1="0" x2="1216" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#22D3EE" stop-opacity=".55"/><stop offset=".55" stop-color="#22D3EE" stop-opacity=".10"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="accentVert" x1="42" y1="116" x2="42" y2="466" gradientUnits="userSpaceOnUse">
    <stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".2" stop-color="#22D3EE" stop-opacity=".55"/><stop offset=".8" stop-color="#22D3EE" stop-opacity=".55"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="strapGrad" x1="1064" y1="0" x2="1064" y2="106" gradientUnits="userSpaceOnUse">
    <stop stop-color="#1B2124"/><stop offset=".55" stop-color="#0D1113"/><stop offset="1" stop-color="#161B1E"/>
  </linearGradient>
  <linearGradient id="metalGrad" x1="1048" y1="104" x2="1080" y2="120" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F1F5F9"/><stop offset=".45" stop-color="#94A3B8"/><stop offset=".7" stop-color="#E2E8F0"/><stop offset="1" stop-color="#64748B"/>
  </linearGradient>
  <linearGradient id="cardGrad" x1="1064" y1="152" x2="1064" y2="436" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0C2127"/><stop offset=".45" stop-color="#07161A"/><stop offset="1" stop-color="#020A0C"/>
  </linearGradient>
  <linearGradient id="holoGrad" x1="1046" y1="294" x2="1084" y2="294" gradientUnits="userSpaceOnUse">
    <stop stop-color="#67E8F9" stop-opacity="0"/><stop offset=".5" stop-color="#A5F3FC" stop-opacity=".14"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" stroke="#5EEAD4" stroke-opacity=".045"/>
  </pattern>
  <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="1" fill="#5EEAD4" opacity=".045"/>
  </pattern>
  <pattern id="barcode" width="22" height="20" patternUnits="userSpaceOnUse">
    <rect x="0" width="1.5" height="20" fill="#94A3B8"/>
    <rect x="3" width="1" height="20" fill="#94A3B8"/>
    <rect x="5.5" width="2.5" height="20" fill="#94A3B8"/>
    <rect x="9.5" width="1" height="20" fill="#94A3B8"/>
    <rect x="12" width="1.5" height="20" fill="#94A3B8"/>
    <rect x="15" width="2" height="20" fill="#94A3B8"/>
    <rect x="18.5" width="1.5" height="20" fill="#94A3B8"/>
  </pattern>
  <clipPath id="frame"><rect width="1280" height="560" rx="28"/></clipPath>
  <clipPath id="cardClip"><rect x="961" y="152" width="206" height="284" rx="16"/></clipPath>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
</defs>
<style>
  .scanbeam { animation: scan 9s linear infinite; }
  @keyframes scan { from { transform: translateY(-90px); } to { transform: translateY(650px); } }
  .pulse { animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .40; } 50% { opacity: 1; } }
  .swing { transform-box: view-box; transform-origin: 1064px 122px; animation: swing 7.5s ease-in-out infinite alternate; }
  @keyframes swing { from { transform: rotate(-1.4deg); } to { transform: rotate(1.4deg); } }
  .holo { transform-box: view-box; transform-origin: 0 0; animation: holo 6s linear infinite; }
  @keyframes holo { 0%, 100% { transform: translateX(-70px); } 50% { transform: translateX(70px); } }
  @media (prefers-reduced-motion: reduce) { .scanbeam, .pulse, .swing, .holo { animation: none; } }
</style>
<g clip-path="url(#frame)">
  <rect width="1280" height="560" fill="url(#bg)"/>
  <rect width="1280" height="560" fill="url(#grid)"/>
  <rect width="1280" height="560" fill="url(#glowCyan)"/>
  <rect width="1280" height="560" fill="url(#glowTeal)"/>
  <rect width="1280" height="560" fill="url(#vignette)"/>

  <g opacity=".7">
