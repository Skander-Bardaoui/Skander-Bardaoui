    <text x="112" y="138" font-family="Consolas, 'Courier New', monospace" fill="#67E8F9" font-size="15.5" letter-spacing="2.4">SOFTWARE ENGINEER / FULL-STACK</text>
    <text x="68" y="218" fill="#E2E8F0" font-size="64" font-weight="500" letter-spacing="-.5">Hi, I'm</text>
    <text x="64" y="322" fill="url(#nameGrad)" font-size="112" font-weight="800" letter-spacing="-2.5">Skander.</text>
    <text x="70" y="370" fill="#94A3B8" font-size="21">Full-stack developer building robust architectures for the digital frontier.</text>
    <g font-family="Consolas, 'Courier New', monospace" fill="#67E8F9" font-size="15" letter-spacing="1.4">
      <text x="70" y="410">REACT <tspan fill="#134E4A">/</tspan> NESTJS <tspan fill="#134E4A">/</tspan> LARAVEL <tspan fill="#134E4A">/</tspan> SPRING BOOT <tspan fill="#134E4A">/</tspan> FASTAPI</text>
    </g>
    <circle class="pulse" cx="76" cy="449" r="4.5" fill="#34D399"/>
    <text x="90" y="454" fill="#CBD5E1" font-size="16">Available for PFE 2026</text>
    <text x="302" y="454" fill="#64748B" font-size="16">·  Tunisia → France</text>
  </g>

