  <path d="M36 120h12M36 462h12" stroke="#22D3EE" stroke-opacity=".5" stroke-width="1.2"/>

  <rect class="scanbeam" x="0" y="-90" width="1280" height="90" fill="url(#beamGrad)"/>

  <g font-family="Consolas, 'Courier New', monospace">
    <rect x="64" y="38" width="30" height="30" rx="8" fill="#06181C" stroke="#155E63"/>
    <text x="79" y="59" text-anchor="middle" fill="#22D3EE" font-size="18" font-weight="700">S</text>
    <text x="106" y="58" fill="#E2E8F0" font-size="15.5" letter-spacing="2.1">SKANDER<tspan fill="#22D3EE">.B</tspan></text>
    <text x="840" y="58" text-anchor="end" fill="#475569" font-size="12.5" letter-spacing="1.2">TUNISIA / FRANCE</text>
