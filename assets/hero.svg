        <rect x="961" y="152" width="206" height="284" fill="url(#scan)" opacity=".7"/>
      </g>
      <rect x="961.5" y="152.5" width="205" height="283" rx="15.5" stroke="#22D3EE" stroke-opacity=".32"/>
      <rect x="965" y="156" width="198" height="276" rx="12" stroke="#22D3EE" stroke-opacity=".06"/>

      <rect x="1051" y="158" width="26" height="6" rx="3" fill="#02090A" stroke="#155E63"/>

      <g font-family="Consolas, 'Courier New', monospace">
        <text x="979" y="184" fill="#E2E8F0" font-size="9.5" letter-spacing="1.6" font-weight="700">SKANDER BARDAOUI</text>
        <text x="979" y="199" fill="#64748B" font-size="7" letter-spacing="1.6">SOFTWARE ENGINEER</text>
        <rect x="1119" y="168" width="30" height="14" rx="7" fill="#041012" stroke="#155E63"/>
        <text x="1134" y="178" text-anchor="middle" fill="#67E8F9" font-size="5.5" letter-spacing=".6">TN / 01</text>
        <line x1="979" y1="211" x2="1149" y2="211" stroke="#123033"/>
      </g>

