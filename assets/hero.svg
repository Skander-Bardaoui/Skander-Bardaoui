      <circle cx="1064" cy="272" r="41" fill="#04161A" stroke="#155E63"/>
      <path d="M1064 216v-6M1064 328v6M1008 272h-6M1120 272h6" stroke="#22D3EE" stroke-opacity=".45" stroke-width="1.2"/>
      <text x="1064" y="285" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="700" fill="url(#nameGrad)" font-size="38" letter-spacing="1">SB</text>

      <g font-family="Consolas, 'Courier New', monospace">
        <text x="979" y="340" fill="#475569" font-size="6" letter-spacing="1.6">ID</text>
        <text x="979" y="353" fill="#CBD5E1" font-size="8" letter-spacing="1">SB-2026-001</text>
        <text x="1149" y="340" text-anchor="end" fill="#475569" font-size="6" letter-spacing="1.6">STATUS</text>
        <circle class="pulse" cx="1090" cy="350.5" r="2.3" fill="#34D399"/>
        <text x="1149" y="353" text-anchor="end" fill="#A7F3D0" font-size="8" letter-spacing="1">PFE 2026</text>
      </g>

      <rect x="979" y="372" width="170" height="20" fill="url(#barcode)" opacity=".45"/>
      <text x="1064" y="405" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" fill="#64748B" font-size="6.5" letter-spacing="2.6">2026 · 0417 · SB</text>
    </g>
  </g>

  <g stroke="#22D3EE" stroke-opacity=".5" stroke-width="1.4">
    <path d="M947 152v-10a6 6 0 0 1 6-6h26"/>
    <path d="M1155 136h26a6 6 0 0 1 6 6v10"/>
    <path d="M947 434v10a6 6 0 0 0 6 6h26"/>
    <path d="M1155 450h26a6 6 0 0 0 6-6v-10"/>
  </g>
  <text x="1064" y="464" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" fill="#E2E8F0" font-size="13" letter-spacing="1.6">SKANDER BARDAOUI</text>
  <text x="1064" y="480" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" fill="#64748B" font-size="10" letter-spacing="1.2">SOFTWARE ENGINEER · TN / 2026</text>

  <line x1="64" y1="492" x2="1216" y2="492" stroke="url(#lineGrad)"/>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="64" y="528" fill="#67E8F9" font-size="24" letter-spacing="1">04</text>
    <text x="64" y="548" fill="#64748B" font-size="12.5" letter-spacing="1.6">FEATURED PROJECTS</text>
    <line x1="330" y1="508" x2="330" y2="550" stroke="#0F2E33"/>
    <text x="354" y="528" fill="#67E8F9" font-size="24" letter-spacing="1">30+</text>
    <text x="354" y="548" fill="#64748B" font-size="12.5" letter-spacing="1.6">PUBLIC REPOS</text>
    <line x1="620" y1="508" x2="620" y2="550" stroke="#0F2E33"/>
    <text x="644" y="528" fill="#67E8F9" font-size="24" letter-spacing="1">06</text>
    <text x="644" y="548" fill="#64748B" font-size="12.5" letter-spacing="1.6">BACKEND FRAMEWORKS</text>
    <line x1="910" y1="508" x2="910" y2="550" stroke="#0F2E33"/>
    <text x="934" y="528" fill="#67E8F9" font-size="24" letter-spacing="1">2026</text>
    <text x="934" y="548" fill="#64748B" font-size="12.5" letter-spacing="1.6">OPEN TO PFE</text>
  </g>
