name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # every day at midnight UTC
  workflow_dispatch:       # lets you run it manually
  push:
    branches:
      - main               # change to master if that's your default branch

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0B5C86&color_dots=#EAF4FB,#CFE8F8,#9DD2F0,#5BB8E8,#1479B8
            dist/github-contribution-grid-snake-dark.svg?color_snake=#A5F3FC&color_dots=#0B1B2B,#0C2D4A,#0F4C75,#1682B8,#38BDF8

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
